name: techtent-tests
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techtent_test
      POSTGRES_PASSWORD: techtent_test_local_only
      POSTGRES_DB: techtent_test
    ports:
      - "127.0.0.1:55435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techtent_test -d techtent_test"]
      interval: 2s
      timeout: 3s
      retries: 30
